# Optional 301 — old brand host → Simankan
# Keep until bookmarks settle; then remove sites-enabled symlink.
#   sudo cp deploy/nginx/zamin.rdmp.in.conf /etc/nginx/sites-available/zamin.rdmp.in
#   sudo ln -sf /etc/nginx/sites-available/zamin.rdmp.in /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name zamin.rdmp.in;

    return 301 https://simankan.rdmp.in$request_uri;
}
