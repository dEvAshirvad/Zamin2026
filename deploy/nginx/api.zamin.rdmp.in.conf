# Optional 301 — old API host → api.simankan.rdmp.in
#   sudo cp deploy/nginx/api.zamin.rdmp.in.conf /etc/nginx/sites-available/api.zamin.rdmp.in
#   sudo ln -sf /etc/nginx/sites-available/api.zamin.rdmp.in /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name api.zamin.rdmp.in;

    return 301 https://api.simankan.rdmp.in$request_uri;
}
