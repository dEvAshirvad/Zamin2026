# Frontend — proxy to docker-compose.prod.yml (127.0.0.1:7854)
# Install:
#   sudo cp deploy/nginx/simankan.rdmp.in.conf /etc/nginx/sites-available/simankan.rdmp.in
#   sudo ln -sf /etc/nginx/sites-available/simankan.rdmp.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d simankan.rdmp.in

server {
    listen 80;
    listen [::]:80;
    server_name simankan.rdmp.in;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:7854;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
